<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17202a">
<title>Буровой журнал 0.2</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#eef1f4;
color:#111;
}

.header{
background:#17202a;
color:white;
padding:18px 16px;
text-align:center;
}

.header h1{
margin:0;
font-size:24px;
}

.header p{
margin:5px 0 0;
font-size:13px;
opacity:.7;
}

.container{
max-width:650px;
margin:auto;
padding:14px;
}

.card{
background:white;
border-radius:16px;
padding:17px;
margin-bottom:14px;
box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.card h2{
margin:0 0 12px;
font-size:19px;
}

label{
display:block;
font-size:14px;
font-weight:600;
margin:12px 0 6px;
}

input,select,textarea{
width:100%;
padding:13px;
font-size:16px;
border:1px solid #ccd1d6;
border-radius:10px;
background:#fafafa;
}

textarea{
min-height:80px;
resize:vertical;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

button{
width:100%;
border:0;
border-radius:12px;
padding:15px;
margin-top:14px;
font-size:16px;
font-weight:700;
background:#1976d2;
color:white;
}

button.delete{
background:#d32f2f;
font-size:14px;
padding:10px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
background:#f1f3f5;
border-radius:12px;
padding:14px;
text-align:center;
}

.stat strong{
display:block;
font-size:24px;
margin-bottom:4px;
}

.result{
background:#e8f5e9;
border-radius:12px;
padding:14px;
margin-top:12px;
font-size:17px;
}

.money{
font-size:25px;
font-weight:800;
}

.shift{
border-top:1px solid #e1e4e8;
padding:14px 0;
}

.shift:first-child{
border-top:0;
padding-top:0;
}

.badge{
display:inline-block;
padding:5px 8px;
border-radius:7px;
background:#eee;
font-size:12px;
margin-top:5px;
}

.empty{
text-align:center;
color:#777;
padding:18px;
}
</style>
</head>

<body>

<div class="header">
<h1>⛏️ Буровой журнал</h1>
<p>Версия 0.2</p>
</div>

<div class="container">

<div class="card">

<h2>📝 Новая смена</h2>

<label>Дата</label>
<input id="date" type="date">

<label>Скважина</label>
<input id="well" placeholder="Например RC-015">

<div class="grid">

<div>
<label>Начальная глубина, м</label>
<input id="startDepth" type="number" inputmode="decimal" placeholder="150">
</div>

<div>
<label>Конечная глубина, м</label>
<input id="endDepth" type="number" inputmode="decimal" placeholder="187">
</div>

</div>

<label>Время начала</label>
<input id="startTime" type="time">

<label>Время окончания</label>
<input id="endTime" type="time">

<div class="grid">

<div>
<label>Простой, часов</label>
<input id="downtime" type="number" step="0.1" inputmode="decimal" placeholder="1.5">
</div>

<div>
<label>Ставка, ₸/м</label>
<input id="rate" type="number" inputmode="numeric" value="200">
</div>

</div>

<label>Причина простоя</label>
<select id="downtimeReason">

<option value="">Нет простоя</option>
<option>Поломка буровой</option>
<option>Проблема с компрессором</option>
<option>Замена штанги</option>
<option>Замена долота</option>
<option>Прихват</option>
<option>Ожидание техники</option>
<option>Ожидание воды</option>
<option>Погода</option>
<option>Другая причина</option>

</select>

<label>Примечание</label>
<textarea id="note" placeholder="Что произошло за смену..."></textarea>

<div class="result">

Проходка:
<div class="money"><span id="liveMeters">0</span> м</div>

Заработок:
<div class="money"><span id="liveMoney">0</span> ₸</div>

</div>

<button onclick="saveShift()">💾 Сохранить смену</button>

</div>


<div class="card">

<h2>📊 Итоги</h2>

<div class="stats">

<div class="stat">
<strong id="totalMeters">0</strong>
метров
</div>

<div class="stat">
<strong id="totalMoney">0</strong>
₸
</div>

<div class="stat">
<strong id="totalShifts">0</strong>
смен
</div>

<div class="stat">
<strong id="totalDowntime">0</strong>
ч
простоя
</div>

</div>

</div>


<div class="card">

<h2>📋 История смен</h2>

<div id="history" class="empty">
Пока нет записей
</div>

</div>

</div>


<script>

let shifts =
JSON.parse(localStorage.getItem("drillingShifts")) || [];


function today(){

let d=new Date();

let month=String(d.getMonth()+1).padStart(2,"0");

let day=String(d.getDate()).padStart(2,"0");

return d.getFullYear()+"-"+month+"-"+day;

}


document.getElementById("date").value=today();


function calculate(){

let start=
Number(document.getElementById("startDepth").value)||0;

let end=
Number(document.getElementById("endDepth").value)||0;

let rate=
Number(document.getElementById("rate").value)||0;

let meters=end-start;

if(meters<0) meters=0;

let money=meters*rate;

document.getElementById("liveMeters").textContent=
meters.toFixed(1);

document.getElementById("liveMoney").textContent=
money.toLocaleString("ru-RU");

}


document.getElementById("startDepth")
.addEventListener("input",calculate);

document.getElementById("endDepth")
.addEventListener("input",calculate);

document.getElementById("rate")
.addEventListener("input",calculate);


function saveShift(){

let date=document.getElementById("date").value;

let well=document.getElementById("well").value.trim();

let start=Number(
document.getElementById("startDepth").value
);

let end=Number(
document.getElementById("endDepth").value
);

let startTime=document.getElementById("startTime").value;

let endTime=document.getElementById("endTime").value;

let downtime=Number(
document.getElementById("downtime").value
)||0;

let rate=Number(
document.getElementById("rate").value
)||0;

let downtimeReason=
document.getElementById("downtimeReason").value;

let note=
document.getElementById("note").value.trim();


if(!well){

alert("Укажи номер скважины.");

return;

}


if(isNaN(start)||isNaN(end)){

alert("Укажи начальную и конечную глубину.");

return;

}


if(end<start){

alert("Конечная глубина не может быть меньше начальной.");

return;

}


let meters=end-start;

let money=meters*rate;


let shift={

id:Date.now(),

date,
well,
start,
end,
meters,
startTime,
endTime,
downtime,
rate,
money,
downtimeReason,
note

};


shifts.push(shift);


localStorage.setItem(
"drillingShifts",
JSON.stringify(shifts)
);


document.getElementById("well").value="";

document.getElementById("startDepth").value="";

document.getElementById("endDepth").value="";

document.getElementById("startTime").value="";

document.getElementById("endTime").value="";

document.getElementById("downtime").value="";

document.getElementById("downtimeReason").value="";

document.getElementById("note").value="";


calculate();

render();


alert("Смена сохранена ✅");

}


function deleteShift(id){

if(!confirm("Удалить эту смену?")) return;

shifts=shifts.filter(
shift=>shift.id!==id
);

localStorage.setItem(
"drillingShifts",
JSON.stringify(shifts)
);

render();

}


function render(){

let totalMeters=0;

let totalMoney=0;

let totalDowntime=0;


shifts.forEach(shift=>{

totalMeters+=shift.meters;

totalMoney+=shift.money;

totalDowntime+=shift.downtime;

});


document.getElementById("totalMeters")
.textContent=totalMeters.toFixed(1);

document.getElementById("totalMoney")
.textContent=totalMoney.toLocaleString("ru-RU");

document.getElementById("totalShifts")
.textContent=shifts.length;

document.getElementById("totalDowntime")
.textContent=totalDowntime.toFixed(1);


let history=document.getElementById("history");


if(shifts.length===0){

history.innerHTML=
'<div class="empty">Пока нет записей</div>';

return;

}


history.innerHTML="";


[...shifts].reverse().forEach(shift=>{

let div=document.createElement("div");

div.className="shift";


div.innerHTML=`

<strong>${shift.date} — ${shift.well}</strong>

<br>

Глубина:
${shift.start} → ${shift.end} м

<br>

📏 Проходка:
<strong>${shift.meters.toFixed(1)} м</strong>

<br>

💰 Заработок:
<strong>${shift.money.toLocaleString("ru-RU")} ₸</strong>

<br>

⏱️ Время:
${shift.startTime || "—"} —
${shift.endTime || "—"}

<br>

🛑 Простой:
${shift.downtime} ч

${shift.downtimeReason ?
`<span class="badge">${shift.downtimeReason}</span>`
:""}

${shift.note ?
`<br>📝 ${shift.note}`
:""}

<button
class="delete"
onclick="deleteShift(${shift.id})">
Удалить
</button>

`;

history.appendChild(div);

});

}


calculate();

render();

</script>

</body>
</html>
