<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Буровой журнал 0.1</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f2f3f5;
    color: #111;
}

.header {
    background: #1f2937;
    color: white;
    padding: 18px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 23px;
}

.header p {
    margin: 5px 0 0;
    opacity: .75;
    font-size: 13px;
}

.container {
    padding: 16px;
    max-width: 600px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.card h2 {
    margin-top: 0;
    font-size: 18px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin: 12px 0 6px;
}

input, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    background: #fafafa;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: 0;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: 600;
}

button.delete {
    background: #dc2626;
    font-size: 14px;
    padding: 10px;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.stat {
    background: #f3f4f6;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
}

.stat strong {
    display: block;
    font-size: 25px;
}

.shift {
    border-top: 1px solid #e5e7eb;
    padding-top: 12px;
    margin-top: 12px;
}

.empty {
    text-align: center;
    color: #777;
    padding: 20px;
}
</style>
</head>

<body>

<div class="header">
    <h1>⛏️ Буровой журнал</h1>
    <p>Версия 0.1</p>
</div>

<div class="container">

    <div class="card">
        <h2>Новая смена</h2>

        <label>Скважина</label>
        <input id="well" placeholder="Например: RC-001">

        <label>Начальная глубина, м</label>
        <input id="startDepth" type="number" placeholder="0">

        <label>Конечная глубина, м</label>
        <input id="endDepth" type="number" placeholder="Например: 150">

        <label>Время начала</label>
        <input id="startTime" type="time">

        <label>Время окончания</label>
        <input id="endTime" type="time">

        <label>Примечание</label>
        <textarea id="note" placeholder="Порода, проблемы, простой, давление и т.д."></textarea>

        <button onclick="saveShift()">💾 Сохранить смену</button>
    </div>

    <div class="card">
        <h2>📊 Статистика</h2>

        <div class="stats">
            <div class="stat">
                <strong id="totalMeters">0</strong>
                метров
            </div>

            <div class="stat">
                <strong id="totalShifts">0</strong>
                смен
            </div>
        </div>
    </div>

    <div class="card">
        <h2>📋 История смен</h2>

        <div id="history" class="empty">
            Пока нет записей
        </div>
    </div>

</div>

<script>

let shifts = JSON.parse(localStorage.getItem("drillingShifts")) || [];

function saveShift() {

    const well = document.getElementById("well").value;
    const startDepth = Number(document.getElementById("startDepth").value);
    const endDepth = Number(document.getElementById("endDepth").value);
    const startTime = document.getElementById("startTime").value;
    const endTime = document.getElementById("endTime").value;
    const note = document.getElementById("note").value;

    if (!well || isNaN(startDepth) || isNaN(endDepth)) {
        alert("Заполни скважину и глубину.");
        return;
    }

    const meters = endDepth - startDepth;

    if (meters < 0) {
        alert("Конечная глубина не может быть меньше начальной.");
        return;
    }

    const shift = {
        id: Date.now(),
        date: new Date().toLocaleDateString("ru-RU"),
        well,
        startDepth,
        endDepth,
        meters,
        startTime,
        endTime,
        note
    };

    shifts.push(shift);

    localStorage.setItem(
        "drillingShifts",
        JSON.stringify(shifts)
    );

    document.getElementById("well").value = "";
    document.getElementById("startDepth").value = "";
    document.getElementById("endDepth").value = "";
    document.getElementById("startTime").value = "";
    document.getElementById("endTime").value = "";
    document.getElementById("note").value = "";

    render();

    alert("Смена сохранена ✅");
}

function deleteShift(id) {

    shifts = shifts.filter(shift => shift.id !== id);

    localStorage.setItem(
        "drillingShifts",
        JSON.stringify(shifts)
    );

    render();
}

function render() {

    const history = document.getElementById("history");

    let totalMeters = 0;

    shifts.forEach(shift => {
        totalMeters += shift.meters;
    });

    document.getElementById("totalMeters").textContent = totalMeters;
    document.getElementById("totalShifts").textContent = shifts.length;

    if (shifts.length === 0) {
        history.innerHTML = '<div class="empty">Пока нет записей</div>';
        return;
    }

    history.innerHTML = "";

    [...shifts].reverse().forEach(shift => {

        const div = document.createElement("div");

        div.className = "shift";

        div.innerHTML = `
            <strong>${shift.date} — ${shift.well}</strong>
            <br>
            ${shift.startDepth} м → ${shift.endDepth} м
            <br>
            <strong>Проходка: ${shift.meters} м</strong>
            <br>
            ${shift.startTime || ""} — ${shift.endTime || ""}
            <br>
            ${shift.note || ""}
            <button class="delete" onclick="deleteShift(${shift.id})">
                Удалить
            </button>
        `;

        history.appendChild(div);
    });
}

render();

</script>

</body>
</html>
